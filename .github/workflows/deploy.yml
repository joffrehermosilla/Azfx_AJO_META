name: Deploy Azure Functions - BCP AJO WhatsApp

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'func-ajo-whatsapp-dev'
  JAVA_VERSION: '21'
  PACKAGE_DIRECTORY: 'target/azure-functions/func-ajo-whatsapp-dev'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Descargar el código ─────────────────────────────────────────────
      - name: 'Checkout code'
        uses: actions/checkout@v4

      # ── 2. Configurar JDK 21 ──────────────────────────────────────────────
      - name: 'Set up Java 21'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # ── 3. Ejecutar pruebas unitarias (17 tests automatizados) ─────────────
      - name: 'Run Unit Tests'
        run: mvn clean test

      # ── 4. Empaquetar Azure Functions con Maven ───────────────────────────
      - name: 'Package Azure Functions'
        run: mvn package -DskipTests

      # ── 5. Desplegar en Azure Function App ────────────────────────────────
      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PACKAGE_DIRECTORY }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
