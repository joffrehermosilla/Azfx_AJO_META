name: Deploy Azure Functions - BCP AJO WhatsApp

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: 'func-ajo-whatsapp-dev'
  JAVA_VERSION: '21'
  PACKAGE_DIRECTORY: 'target/azure-functions/func-ajo-whatsapp-dev'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Azure_Secrets   # <--- AGREGAR ESTA LÍNEA

    steps:
      # ── 1. Descargar el código fuente ─────────────────────────────────────
      - name: 'Checkout code'
        uses: actions/checkout@v4

      # ── 2. Configurar Java 21 (Temurin) ──────────────────────────────────
      - name: 'Set up Java 21'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # ── 3. Ejecutar Pruebas Unitarias ──────────────────────────────────────
      - name: 'Run Unit Tests'
        run: mvn clean test

      # ── 4. Empaquetar Azure Functions con Maven ───────────────────────────
      - name: 'Package Azure Functions'
        run: mvn package -DskipTests

      # ── 5. Iniciar Sesión en Azure ─────────────────────────────────────────
      - name: 'Azure Login'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── 6. Desplegar en Azure Function App ────────────────────────────────
      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PACKAGE_DIRECTORY }}